title: Folders
views:
  - title: Folders
    path: folders
    icon: mdi:newspaper-variant-multiple
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:folders-card
      - type: grid
        column_span: 1
        cards:
          - type: todo-list
            title: Watch list
            entity: todo.folders_watch_list
          - type: calendar
            title: Folders
            initial_view: listWeek
            entities:
              - calendar.folders_folders
  - title: Map
    path: map
    icon: mdi:map-marker-radius
    type: panel
    cards:
      - type: custom:folders-card
        view: map
